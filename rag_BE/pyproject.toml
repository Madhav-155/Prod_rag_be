[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'rag-backend'
version = '0.1.0'
description = 'Local RAG backend with traceable original evidence'
readme = 'README.md'
requires-python = '>=3.12,<3.14'
dependencies = [
  'fastapi>=0.115,<1',
  'uvicorn>=0.30,<1',
  'pydantic>=2.10,<3',
  'pydantic-settings>=2.7,<3',
  'SQLAlchemy>=2.0,<2.1',
  'psycopg[binary]>=3.2,<4',
  'alembic>=1.14,<2',
  'pdfplumber>=0.11,<0.12',
  'markdown-it-py>=3,<5',
  'httpx>=0.28,<1',
  'numpy>=2,<3',
  'onnxruntime>=1.20,<2',
  'tokenizers>=0.21,<1',
]

[project.optional-dependencies]
dev = ['pytest>=8,<10', 'httpx>=0.28,<1', 'ruff>=0.9,<1', 'reportlab>=4,<5']

[tool.setuptools]
packages = [
  'rag_backend',
  'rag_backend.answering',
  'rag_backend.api',
  'rag_backend.api.routes',
  'rag_backend.api.schemas',
  'rag_backend.conversations',
  'rag_backend.domain',
  'rag_backend.evaluation',
  'rag_backend.indexing',
  'rag_backend.ingestion',
  'rag_backend.ingestion.parsers',
  'rag_backend.jobs',
  'rag_backend.retrieval',
  'rag_backend.storage',
  'rag_backend.storage.repositories',
]

[tool.setuptools.package-dir]
rag_backend = 'src'

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra --import-mode=importlib'
markers = ['integration: requires the configured local PostgreSQL database']

[tool.ruff]
target-version = 'py312'
line-length = 100

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B']

[tool.ruff.lint.isort]
known-first-party = ['rag_backend']

[tool.ruff.format]
quote-style = 'single'
